name: Collect QDII data and deploy Pages

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: '部署前发送一次 ntfy/Webhook 测试通知'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '30 9,14 * * 1-5'
      timezone: 'Asia/Shanghai'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

concurrency:
  group: qdii-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      QDII_NOTIFY: ${{ secrets.QDII_NOTIFY || 'console' }}
      QDII_NTFY_SERVER: ${{ secrets.QDII_NTFY_SERVER || 'https://ntfy.sh' }}
      QDII_NTFY_TOPIC: ${{ secrets.QDII_NTFY_TOPIC }}
      QDII_NTFY_TOKEN: ${{ secrets.QDII_NTFY_TOKEN }}
      QDII_WEBHOOK_KIND: ${{ secrets.QDII_WEBHOOK_KIND }}
      QDII_WEBHOOK_TOKEN: ${{ secrets.QDII_WEBHOOK_TOKEN }}
      QDII_WEBHOOK_URL: ${{ secrets.QDII_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 排队中的 workflow_dispatch 可能仍指向旧 SHA；先同步上一次采集提交的数据。
      - name: Sync latest main branch
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test notification channels
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        run: node src/cli.js notify-test

      - name: Collect latest limits and send notifications
        run: node src/cli.js collect

      - name: Refresh fund profiles
        env:
          QDII_PROFILE_CACHE_MS: '604800000'
          QDII_PROFILE_CONCURRENCY: '4'
        run: node tools/prefetch-profiles.mjs

      - name: Build static site
        run: node tools/build-pages.mjs

      - name: Persist snapshots and profile cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: update QDII snapshot [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
